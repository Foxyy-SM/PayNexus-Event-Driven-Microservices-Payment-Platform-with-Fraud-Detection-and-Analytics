name: PayNexus CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Maven tests and verification
        run: mvn -B verify
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend tests and build
        working-directory: web
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e

  integration:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the complete runtime
        run: docker compose --env-file .env.example up --build --wait -d
      - name: Run integration smoke tests
        run: |
          curl --fail --retry 20 --retry-delay 3 http://localhost:8080/actuator/health
          curl --fail --retry 20 --retry-delay 3 http://localhost/
          curl --fail --retry 20 --retry-delay 3 http://localhost:8088/realms/paynexus/.well-known/openid-configuration
      - name: Runtime logs
        if: failure()
        run: docker compose --env-file .env.example logs --no-color
      - name: Stop runtime
        if: always()
        run: docker compose --env-file .env.example down --volumes

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    needs: [test, secrets]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - user-service
          - payment-service
          - wallet-service
          - fraud-service
          - notification-service
          - transaction-service
          - web
    steps:
      - uses: actions/checkout@v4
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/paynexus-${{ matrix.service }}:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Build image
        run: |
          if [ "${{ matrix.service }}" = web ]; then
            docker build -f web/Dockerfile \
              --build-arg VITE_DEMO_MODE=false \
              --build-arg VITE_KEYCLOAK_URL=https://auth.paynexus.example \
              --build-arg VITE_KEYCLOAK_REALM=paynexus \
              --build-arg VITE_KEYCLOAK_CLIENT_ID=paynexus-web \
              -t "$IMAGE" web
          else
            docker build -f docker/Dockerfile --build-arg "SERVICE=${{ matrix.service }}" -t "$IMAGE" .
          fi
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image on main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker tag "$IMAGE" "${IMAGE%:*}:latest"
          docker push "$IMAGE"
          docker push "${IMAGE%:*}:latest"

  manifests:
    needs: secrets
    runs-on: ubuntu-latest
    env:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Render Kubernetes manifests
        run: kubectl kustomize k8s > rendered.yaml
      - uses: docker://ghcr.io/yannh/kubeconform:v0.6.7
        with:
          args: -strict -summary -ignore-missing-schemas rendered.yaml
      - name: Deploy main when credentials exist
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.KUBE_CONFIG != ''
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" | base64 --decode > "$HOME/.kube/config"
          kubectl apply -k k8s
          kubectl -n paynexus rollout status deployment/api-gateway --timeout=5m
      - name: Report intentionally skipped deployment
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.KUBE_CONFIG == ''
        run: echo "KUBE_CONFIG is absent; manifests were validated but no deployment was attempted."
