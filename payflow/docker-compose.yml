x-service: &service
  build:
    context: .
    dockerfile: docker/Dockerfile
  restart: unless-stopped
  environment: &service-env
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_USER: paynexus
    DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    KAFKA_BROKERS: kafka:9092
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    KEYCLOAK_ISSUER_URI: http://localhost:8088/realms/paynexus
    KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/paynexus/protocol/openid-connect/certs
    OTEL_SERVICE_NAME: paynexus
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
  depends_on: &service-dependencies
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    kafka: { condition: service_healthy }
    keycloak: { condition: service_healthy }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: paynexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    entrypoint: ["/bin/sh", "/opt/payflow/keycloak-entrypoint.sh"]
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KEYCLOAK_PAYMENT_CLIENT_SECRET: ${KEYCLOAK_PAYMENT_CLIENT_SECRET:?set KEYCLOAK_PAYMENT_CLIENT_SECRET in .env}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-export.json:/tmp/realm-source.json:ro
      - ./docker/keycloak-entrypoint.sh:/opt/payflow/keycloak-entrypoint.sh:ro
    ports: ["8088:8080"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30

  jaeger:
    image: jaegertracing/all-in-one:1.64.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4317:4317", "4318:4318"]

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]

  user-service:
    <<: *service
    build: { context: ., dockerfile: docker/Dockerfile, args: { SERVICE: user-service } }
    environment: { <<: *service-env, OTEL_SERVICE_NAME: user-service, DB_NAME: paynexus_users }
    ports: ["8081:8081"]

  wallet-service:
    <<: *service
    build: { context: ., dockerfile: docker/Dockerfile, args: { SERVICE: wallet-service } }
    environment: { <<: *service-env, OTEL_SERVICE_NAME: wallet-service, DB_NAME: paynexus_wallets }
    ports: ["8083:8083"]

  payment-service:
    <<: *service
    build: { context: ., dockerfile: docker/Dockerfile, args: { SERVICE: payment-service } }
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: payment-service
      DB_NAME: paynexus_payments
      WALLET_URL: http://wallet-service:8083
      FRAUD_URL: http://fraud-service:8084
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/paynexus/protocol/openid-connect/token
      KEYCLOAK_PAYMENT_CLIENT_SECRET: ${KEYCLOAK_PAYMENT_CLIENT_SECRET:?set KEYCLOAK_PAYMENT_CLIENT_SECRET in .env}
      RECONCILIATION_INTERVAL: ${RECONCILIATION_INTERVAL:-PT5M}
      RECONCILIATION_STALE_THRESHOLD: ${RECONCILIATION_STALE_THRESHOLD:-PT30M}
    ports: ["8082:8082"]

  fraud-service:
    <<: *service
    build: { context: ., dockerfile: docker/Dockerfile, args: { SERVICE: fraud-service } }
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: fraud-service
      DB_NAME: paynexus_fraud
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports: ["8084:8084"]

  notification-service:
    <<: *service
    build: { context: ., dockerfile: docker/Dockerfile, args: { SERVICE: notification-service } }
    environment: { <<: *service-env, OTEL_SERVICE_NAME: notification-service, DB_NAME: paynexus_notifications }
    ports: ["8085:8085"]

  transaction-service:
    <<: *service
    build: { context: ., dockerfile: docker/Dockerfile, args: { SERVICE: transaction-service } }
    environment: { <<: *service-env, OTEL_SERVICE_NAME: transaction-service, DB_NAME: paynexus_transactions }
    ports: ["8086:8086"]

  api-gateway:
    <<: *service
    build: { context: ., dockerfile: docker/Dockerfile, args: { SERVICE: api-gateway } }
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: api-gateway
      USER_URL: http://user-service:8081
      PAYMENT_URL: http://payment-service:8082
      WALLET_URL: http://wallet-service:8083
      FRAUD_URL: http://fraud-service:8084
      NOTIFICATION_URL: http://notification-service:8085
      TRANSACTION_URL: http://transaction-service:8086
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost,http://localhost:*,http://127.0.0.1:*}
    ports: ["8080:8080"]

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8088}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-paynexus}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-paynexus-web}
    restart: unless-stopped
    ports: ["80:80"]
    depends_on:
      api-gateway: { condition: service_started }
      keycloak: { condition: service_healthy }

volumes:
  postgres_data:
