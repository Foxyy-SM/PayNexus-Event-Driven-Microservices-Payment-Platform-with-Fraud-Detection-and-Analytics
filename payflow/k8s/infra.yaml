apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: paynexus
data:
  init-databases.sh: |
    #!/bin/sh
    set -eu
    for database in paynexus_users paynexus_wallets paynexus_payments paynexus_fraud paynexus_notifications paynexus_transactions; do
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres \
        -c "SELECT 1 FROM pg_database WHERE datname = '$database'" | grep -q 1 ||
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres \
        -c "CREATE DATABASE $database"
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: paynexus
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: paynexus
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: paynexus-secrets, key: POSTGRES_PASSWORD }
          ports: [{ containerPort: 5432 }]
          volumeMounts:
            - name: init-databases
              mountPath: /docker-entrypoint-initdb.d/init-databases.sh
              subPath: init-databases.sh
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "paynexus"]
      volumes:
        - name: init-databases
          configMap:
            name: postgres-init
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: paynexus
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: paynexus
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: paynexus
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: paynexus
spec:
  replicas: 1
  selector:
    matchLabels: { app: kafka }
  template:
    metadata:
      labels: { app: kafka }
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka.paynexus.svc.cluster.local:9092
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@kafka.paynexus.svc.cluster.local:9093
            - name: CLUSTER_ID
              value: MkU3OEVBNTcwNTJENDM2Qk
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
          ports: [{ containerPort: 9092 }]
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: paynexus
spec:
  selector: { app: kafka }
  ports: [{ port: 9092, targetPort: 9092 }]
