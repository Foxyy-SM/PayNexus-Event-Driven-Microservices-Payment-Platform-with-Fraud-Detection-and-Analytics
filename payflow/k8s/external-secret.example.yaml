# Requires External Secrets Operator and a ClusterSecretStore named aws-secrets-manager.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: paynexus-secrets
  namespace: paynexus
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: paynexus-secrets
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: paynexus/database
        property: password
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: paynexus/database
        property: password
    - secretKey: KEYCLOAK_PAYMENT_CLIENT_SECRET
      remoteRef:
        key: paynexus/keycloak
        property: paymentClientSecret
    - secretKey: KEYCLOAK_ADMIN
      remoteRef:
        key: paynexus/keycloak
        property: adminUsername
    - secretKey: KEYCLOAK_ADMIN_PASSWORD
      remoteRef:
        key: paynexus/keycloak
        property: adminPassword
    - secretKey: GRAFANA_ADMIN_USER
      remoteRef:
        key: paynexus/observability
        property: grafanaAdminUsername
    - secretKey: GRAFANA_ADMIN_PASSWORD
      remoteRef:
        key: paynexus/observability
        property: grafanaAdminPassword
