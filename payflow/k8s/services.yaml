apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: paynexus
spec:
  replicas: 1
  selector:
    matchLabels: { app: user-service }
  template:
    metadata:
      labels: { app: user-service }
    spec:
      containers:
        - name: app
          image: paynexus/user-service:1.0.0
          ports: [{ containerPort: 8081 }]
          envFrom:
            - configMapRef: { name: paynexus-config }
            - secretRef: { name: paynexus-secrets }
          env:
            - name: DB_NAME
              value: paynexus_users
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
          resources:
            requests: { cpu: 150m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: paynexus
spec:
  selector: { app: user-service }
  ports: [{ port: 8081, targetPort: 8081 }]
---
